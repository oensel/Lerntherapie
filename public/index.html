<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lernpraxis</title>
<meta name="theme-color" content="#0e5c6b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body><div class="app">
<nav id="nav"><div class="brand">Lern<span>praxis</span></div></nav>
<main id="main"><p class="sub">Lade …</p></main></div>
<div class="pop" id="pop"><div class="dlg" id="dlg"></div></div>
<script type="module" src="js/app.js"></script>
</body></html>
