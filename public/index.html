<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lernpraxis – UI-Entwurf</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: ruhig, aufgeräumt, wie ein gut geführtes Praxisbuch
   IDEA: Schulheft mit Textmarker – Linien, Randspalte, gelbe Markierung für das, was heute zählt
   PICTURE: das Werkzeug selbst – Wochenkalender, Klientenakte, Rechnungslauf
   COLOUR/TYPE: weiß, Graphit-Tinte, Petrol als Hauptfarbe, Textmarker-Gelb als Akzent; Figtree
   LAYOUT: Seitenleiste + Arbeitsfläche, unter 760px Leiste oben als Reiter */
:root{color-scheme:light dark;--bg:light-dark(#fff,#111518);--panel:light-dark(#f6f7f8,#181d21);--line:light-dark(#e3e6e9,#2a3137);--ink:light-dark(#1b2329,#e6eaed);--mute:light-dark(#5d6973,#9aa6af);--main:light-dark(#0e5c6b,#5fb3c2);--mainbg:light-dark(#e4f0f2,#16323a);--mark:light-dark(#ffe45c,#d6b928);--ok:#2f8a4e;--abs:#7a8691;--aus:#d9822b;--unent:#c43d3d;--plan:var(--main)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
nav .brand{font-weight:700;font-size:18px;padding:0 10px 16px}nav .brand span{background:linear-gradient(transparent 55%,var(--mark) 55%)}
nav a{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;color:var(--ink);text-decoration:none;min-height:44px}
nav a:hover{background:var(--line)}nav a.on{background:var(--mainbg);color:var(--main);font-weight:600}
.badge{background:var(--mark);color:#1b2329;border-radius:99px;padding:0 8px;font-size:12px;font-weight:700}
main{padding:24px clamp(16px,3vw,36px);max-width:1240px}
h1{font-size:30px;line-height:1.1;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}.sub{color:var(--mute);margin:0 0 20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg)}
button,.btn{font:inherit;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.pri{background:var(--main);border-color:var(--main);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--mark);outline-offset:1px}
input,select,textarea{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:13px;color:var(--mute);font-weight:500}
td.n{text-align:right;white-space:nowrap}tr.click{cursor:pointer}tr.click:hover{background:var(--panel)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}.st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.mark{background:linear-gradient(transparent 50%,var(--mark) 50%)}
.rem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.days{font-size:22px;font-weight:700;width:52px;text-align:center;line-height:1}.days small{display:block;font-size:11px;font-weight:500;color:var(--mute)}
.days.due{background:var(--mark);color:#1b2329;border-radius:8px;padding:6px 0}
/* Kalender */
.cal{display:grid;grid-template-columns:48px repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .h{padding:8px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line);background:var(--panel)}.cal .h.today{color:var(--main)}
.cal .t{font-size:12px;color:var(--mute);padding:2px 6px;height:56px;border-top:1px solid var(--line)}
.col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(var(--bg) 0 55px,var(--line) 55px 56px)}
.ev{position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 6px;font-size:12px;line-height:1.3;cursor:pointer;border:0;text-align:left;background:color-mix(in srgb,var(--c) 16%,var(--bg));border-left:4px solid var(--c);color:var(--ink);overflow:hidden}
.ev b{display:block;font-size:12.5px}.ev.x{text-decoration:line-through;opacity:.7}
.pop{position:fixed;inset:0;background:rgb(0 0 0/.35);display:none;place-items:center;padding:16px;z-index:9}.pop.on{display:grid}
.dlg{background:var(--bg);border-radius:14px;padding:20px;width:min(440px,100%);box-shadow:0 20px 60px rgb(0 0 0/.3)}
.opts{display:grid;gap:8px;margin:14px 0}.opts button{justify-content:flex-start;display:flex;gap:10px;align-items:center;text-align:left;min-height:52px}
.opts button[disabled]{opacity:.4;cursor:not-allowed}.opts small{display:block;color:var(--mute);font-size:12px}
.hint{font-size:13px;background:var(--panel);border-radius:8px;padding:8px 10px;color:var(--mute)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0}.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none}.tabs button.on{border-color:var(--main);color:var(--main);font-weight:600}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:18px}.tl>div{position:relative;padding-bottom:16px}.tl>div::before{content:"";position:absolute;left:-25px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid var(--bg)}
.paper{background:#fff;color:#1b2329;border:1px solid var(--line);border-radius:4px;padding:28px;font-size:13px;box-shadow:0 6px 24px rgb(0 0 0/.08);max-width:520px}
.paper h3{margin:0 0 2px;font-size:18px}.paper table td,.paper table th{border-color:#e3e6e9;padding:6px 4px}
.note{font-size:12px;color:var(--mute);margin-top:24px}
@media(max-width:760px){.app{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}nav .brand{display:none}nav a{flex:none;gap:8px}
 .cal{grid-template-columns:40px repeat(5,minmax(64px,1fr));overflow-x:auto}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute)}.stack td:empty{display:none}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script></head>
<body><div class="app">
<nav id="nav"><div class="brand">Lern<span>praxis</span></div></nav>
<main id="main"></main></div>
<div class="pop" id="pop"><div class="dlg" id="dlg"></div></div>
<script>{
const NOW=new Date('2026-11-26T10:30');
const ST={geplant:['Geplant','--plan'],statt:['Stattgefunden','--ok'],abgesagt:['Abgesagt (≥ 24 h)','--abs'],ausgefallen:['Ausgefallen (< 24 h gemeldet)','--aus'],unent:['Unentschuldigt','--unent']};
const KL=[
{id:1,name:'Mia Becker',geb:'2016',schwer:'LRS',kontakt:'Sandra Becker · 0171 2233445',satz:58,kostentraeger:'Selbstzahler',seit:'2026-03-02',aktiv:true,material:null},
{id:2,name:'Jonas Wolf',geb:'2015',schwer:'Dyskalkulie',kontakt:'Thomas Wolf · 0160 9988776',satz:62,kostentraeger:'Jugendamt (§ 35a SGB VIII)',seit:'2025-09-15',aktiv:true,material:null},
{id:3,name:'Lea Schmitt',geb:'2017',schwer:'LRS',kontakt:'Anna Schmitt · 0152 4455667',satz:58,kostentraeger:'Selbstzahler',erster:'2026-12-01T14:00',aktiv:true,material:{versandt:false}},
{id:4,name:'Emil Hoffmann',geb:'2014',schwer:'Dyskalkulie, ADS',kontakt:'Katrin Hoffmann · 0176 1122334',satz:62,kostentraeger:'Jugendamt (§ 35a SGB VIII)',erster:'2026-12-03T15:30',aktiv:true,material:{versandt:true,am:'2026-11-24',wie:'Post'}},
{id:5,name:'Noah Klein',geb:'2016',schwer:'LRS',kontakt:'Jana Klein · 0151 6677889',satz:58,kostentraeger:'Selbstzahler',erster:'2026-12-09T16:00',aktiv:true,material:{versandt:false}},
{id:6,name:'Sophie Neumann',geb:'2013',schwer:'Dyskalkulie',kontakt:'—',satz:58,kostentraeger:'Selbstzahler',seit:'2024-02-01',aktiv:false,material:null}];
let T=[ // Termine KW 48
[1,'2026-11-23T14:00','statt','Silbenschwingen, Lesetext „Herbst“ (S. 1–3), Fehleranalyse Diktat'],
[2,'2026-11-23T15:30','statt','Zehnerübergang mit Rechenrahmen, Zahlenstrahl bis 100'],
[1,'2026-11-24T16:00','ausgefallen','Mutter hat am selben Tag krankheitsbedingt abgesagt'],
[2,'2026-11-25T14:00','unent',''],
[1,'2026-11-26T14:00','geplant',''],[2,'2026-11-26T15:30','geplant',''],
[2,'2026-11-27T14:00','abgesagt','Klassenfahrt, am 24.11. abgesagt'],
[1,'2026-11-27T15:30','geplant',''],
[1,'2026-11-16T14:00','statt','Wortarten markieren, Auslautverhärtung d/t'],[2,'2026-11-18T15:30','statt','Einmaleins-Kernaufgaben, Spiel „Malfix“'],
[1,'2026-11-09T14:00','statt','Lernstandserhebung HSP, Elterngespräch 15 min'],[2,'2026-11-11T15:30','unent','']
].map((a,i)=>({id:i+1,k:a[0],d:a[1],s:a[2],txt:a[3],dauer:60}));
const RE=[{nr:'2026-11-001',k:2,mon:'Oktober 2026',betrag:310,st:'Bezahlt'},{nr:'2026-11-002',k:1,mon:'Oktober 2026',betrag:232,st:'Offen'},{nr:'2026-10-001',k:2,mon:'September 2026',betrag:248,st:'Bezahlt'},{nr:'2026-10-002',k:1,mon:'September 2026',betrag:290,st:'Bezahlt'}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kl=id=>KL.find(k=>k.id==id);
const fd=d=>new Date(d).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});
const ft=d=>new Date(d).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const eur=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const st=s=>`<span class="st" style="--c:var(${ST[s][1]})">${ST[s][0]}</span>`;
const tage=d=>Math.ceil((new Date(d.slice(0,10))-new Date('2026-11-26'))/864e5);
const offen=()=>KL.filter(k=>k.material&&!k.material.versandt&&tage(k.erster)<=7);
const V={
uebersicht(){const heute=T.filter(t=>t.d.startsWith('2026-11-26'));const rem=KL.filter(k=>k.material).sort((a,b)=>a.erster.localeCompare(b.erster));
return`<h1>Guten Morgen</h1><p class="sub">Donnerstag, 26. November 2026 · ${heute.length} Termine heute</p>
<div class="grid"><div class="card"><h2>Material vor dem Ersttermin</h2>${rem.map(k=>{const d=tage(k.erster),m=k.material;return`<div class="rem"><div class="days ${!m.versandt&&d<=7?'due':''}">${d}<small>Tage</small></div><div><b>${esc(k.name)}</b><br><span class="sub" style="margin:0">Ersttermin ${fd(k.erster)}, ${ft(k.erster)} · ${m.versandt?`versandt am ${new Date(m.am).toLocaleDateString('de-DE')} (${m.wie})`:d<=7?'<span class="mark">jetzt versenden</span>':'Erinnerung ab '+new Date(new Date(k.erster)-7*864e5).toLocaleDateString('de-DE')}</span></div>${m.versandt?'<span class="st" style="--c:var(--ok)">erledigt</span>':`<button data-send="${k.id}" ${d>7?'disabled':''}>Versandt</button>`}</div>`}).join('')}</div>
<div class="card"><h2>Heute</h2>${heute.map(t=>`<div class="rem"><div class="days" style="font-size:16px">${ft(t.d)}</div><div><b>${esc(kl(t.k).name)}</b><br>${st(t.s)}</div><button data-term="${t.id}">Status</button></div>`).join('')}
<h2 style="margin-top:20px">Nächster Rechnungslauf</h2><p style="margin:0">Dienstag, <b>01.12.2026, 06:00 Uhr</b> – automatisch für November.<br><span class="sub">Vorschau: ${KL.filter(k=>k.aktiv&&!k.material).length} Rechnungen</span></p><button data-go="rechnungen" style="margin-top:10px">Vorschau ansehen</button></div></div>`},
kalender(){const tage5=['2026-11-23','2026-11-24','2026-11-25','2026-11-26','2026-11-27'],h0=13,hs=[13,14,15,16,17,18];
return`<div class="row"><div><h1>Kalender</h1><p class="sub">KW 48 · 23.–27. November 2026 · Termin anklicken, um den Status zu setzen</p></div><span class="sp"></span><button>‹</button><button>Heute</button><button>›</button><button class="pri" data-neu>+ Termin</button></div>
<div class="cal"><div class="h"></div>${tage5.map(d=>`<div class="h ${d=='2026-11-26'?'today':''}">${fd(d)}</div>`).join('')}
<div>${hs.map(h=>`<div class="t">${h}:00</div>`).join('')}</div>
${tage5.map(d=>`<div class="col">${T.filter(t=>t.d.startsWith(d)).map(t=>{const dt=new Date(t.d),top=(dt.getHours()+dt.getMinutes()/60-h0)*56;return`<button class="ev ${t.s=='abgesagt'?'x':''}" style="top:${top+2}px;height:${t.dauer/60*56-4}px;--c:var(${ST[t.s][1]})" data-term="${t.id}"><b>${esc(kl(t.k).name)}</b>${ft(t.d)} · ${ST[t.s][0].split(' ')[0]}</button>`}).join('')}</div>`).join('')}</div>
<div class="row" style="margin-top:12px">${Object.keys(ST).map(st).join('')}</div>`},
klienten(){const zeig=V._arch?KL.filter(k=>!k.aktiv):KL.filter(k=>k.aktiv);
return`<div class="row"><div><h1>Klienten</h1><p class="sub">${KL.filter(k=>k.aktiv).length} aktiv · ${KL.filter(k=>!k.aktiv).length} archiviert</p></div><span class="sp"></span><input placeholder="Suchen …" style="width:200px"><button data-arch>${V._arch?'Aktive zeigen':'Archiv zeigen'}</button><button class="pri" data-edit="0">+ Neuer Klient</button></div>
<table class="stack"><thead><tr><th>Name</th><th>Schwerpunkt</th><th>Kostenträger</th><th>Nächster Termin</th><th class="n">Satz</th></tr></thead><tbody>
${zeig.map(k=>{const n=T.filter(t=>t.k==k.id&&t.s=='geplant')[0];return`<tr class="click" data-kl="${k.id}"><td><b>${esc(k.name)}</b><br><span class="sub">Jg. ${k.geb}</span></td><td>${esc(k.schwer)}</td><td>${esc(k.kostentraeger)}</td><td>${n?fd(n.d)+', '+ft(n.d):k.erster?'Ersttermin '+fd(k.erster):'—'}</td><td class="n">${eur(k.satz)}</td></tr>`}).join('')}</tbody></table>`},
akte(){const k=kl(V._k),hist=T.filter(t=>t.k==k.id).sort((a,b)=>b.d.localeCompare(a.d)),tab=V._tab||'hist';
const z=s=>hist.filter(t=>t.s==s).length;
return`<button data-go="klienten">‹ Alle Klienten</button><div class="row" style="margin-top:12px"><div><h1>${esc(k.name)}</h1><p class="sub">${esc(k.schwer)} · ${esc(k.kostentraeger)} · ${eur(k.satz)} je Einheit</p></div><span class="sp"></span><button data-edit="${k.id}">Bearbeiten</button><button data-archive="${k.id}">${k.aktiv?'Archivieren':'Reaktivieren'}</button><button class="pri" data-doku="${k.id}">+ Eintrag</button></div>
<div class="row">${['statt','ausgefallen','unent','abgesagt'].map(s=>`<div class="card" style="flex:1;min-width:130px"><div style="font-size:24px;font-weight:700">${z(s)}</div>${st(s)}</div>`).join('')}</div>
<div class="tabs">${[['hist','Terminhistorie'],['stamm','Stammdaten'],['re','Rechnungen']].map(([i,l])=>`<button data-tab="${i}" class="${tab==i?'on':''}">${l}</button>`).join('')}</div>
${tab=='hist'?`<div class="tl">${hist.map(t=>`<div style="--c:var(${ST[t.s][1]})"><b>${fd(t.d)} ${ft(t.d)}</b> · ${st(t.s)} <button data-term="${t.id}" style="min-height:30px;font-size:13px;margin-left:6px">ändern</button><div>${t.txt?esc(t.txt):'<span class="sub">Keine Aufzeichnung</span>'}</div></div>`).join('')||'<p class="sub">Noch keine Termine.</p>'}</div>`
:tab=='stamm'?`<div class="grid"><div class="card"><label>Kontakt (Erziehungsberechtigte)</label>${esc(k.kontakt)}<label>Jahrgang</label>${k.geb}<label>In Therapie seit</label>${k.seit?new Date(k.seit).toLocaleDateString('de-DE'):'Ersttermin '+fd(k.erster)}</div><div class="card"><label>Rechnungsempfänger</label>${esc(k.kostentraeger)}<label>Abrechnung</label>Stattgefunden + ausgefallen + unentschuldigt; abgesagt (≥ 24 h) kostenfrei</div></div>`
:`<table><thead><tr><th>Nr.</th><th>Monat</th><th class="n">Betrag</th><th>Status</th></tr></thead><tbody>${RE.filter(r=>r.k==k.id).map(r=>`<tr><td>${r.nr}</td><td>${r.mon}</td><td class="n">${eur(r.betrag)}</td><td>${r.st}</td></tr>`).join('')}</tbody></table>`}`},
doku(){const t=T.filter(t=>t.s=='statt'||t.s=='geplant');
return`<h1>Sitzung dokumentieren</h1><p class="sub">Was wurde wann gemacht – landet automatisch in der Terminhistorie des Klienten.</p>
<form class="card" id="dform" style="max-width:640px"><label for="dk">Klient</label><select id="dk">${KL.filter(k=>k.aktiv).map(k=>`<option value="${k.id}" ${k.id==V._k?'selected':''}>${esc(k.name)}</option>`).join('')}</select>
<div class="grid" style="gap:10px"><div><label for="dd">Datum &amp; Uhrzeit</label><input id="dd" type="datetime-local" value="2026-11-26T14:00"></div><div><label for="dm">Dauer</label><select id="dm"><option>45 Minuten</option><option selected>60 Minuten</option><option>90 Minuten</option></select></div></div>
<label for="dt">Inhalte / Übungen</label><textarea id="dt" rows="4" placeholder="z. B. Silbenschwingen, Lesetext S. 4–6, Diktat mit Fehleranalyse"></textarea>
<label for="db">Beobachtungen</label><textarea id="db" rows="3" placeholder="Konzentration, Motivation, Fortschritte"></textarea>
<label for="dh">Hausaufgabe / nächste Schritte</label><input id="dh">
<div class="row" style="margin-top:16px"><span class="sp"></span><button type="reset">Leeren</button><button class="pri">Speichern &amp; als stattgefunden markieren</button></div></form>`},
rechnungen(){const nov=KL.filter(k=>k.aktiv&&!k.material).map(k=>{const ts=T.filter(t=>t.k==k.id&&t.d.startsWith('2026-11')&&['statt','ausgefallen','unent','geplant'].includes(t.s));return{k,ts,sum:ts.length*k.satz}});const p=nov[0];
return`<h1>Rechnungen</h1><p class="sub">Automatischer Lauf am 1. jedes Monats, 06:00 Uhr · erstellt je Klient ein PDF für den Vormonat</p>
<div class="grid"><div class="card"><h2>Vorschau Lauf 01.12.2026 (November)</h2><table class="stack"><thead><tr><th>Klient</th><th class="n">Einheiten</th><th class="n">Betrag</th></tr></thead><tbody>${nov.map(r=>`<tr><td>${esc(r.k.name)}</td><td class="n">${r.ts.length}</td><td class="n">${eur(r.sum)}</td></tr>`).join('')}</tbody></table>
<p class="hint">Noch geplante Novembertermine werden vor dem Lauf auf ihren Status geprüft. Ungesetzte Status erscheinen hier als Warnung.</p><div class="row"><button>Lauf jetzt manuell starten</button></div>
<h2 style="margin-top:20px">Erstellte Rechnungen</h2><table class="stack"><thead><tr><th>Nr.</th><th>Klient</th><th>Monat</th><th class="n">Betrag</th><th>Status</th></tr></thead><tbody>${RE.map(r=>`<tr><td>${r.nr}</td><td>${esc(kl(r.k).name)}</td><td>${r.mon}</td><td class="n">${eur(r.betrag)}</td><td><span class="st" style="--c:var(${r.st=='Bezahlt'?'--ok':'--aus'})">${r.st}</span></td></tr>`).join('')}</tbody></table></div>
<div><div class="paper"><div class="row"><div><h3>Rechnung 2026-12-001</h3>Lernpraxis Muster · Musterstraße 1 · 12345 Musterstadt</div></div><p>${esc(p.k.kostentraeger)}<br>betr. ${esc(p.k.name)}<br>Leistungszeitraum: November 2026</p>
<table><thead><tr><th>Datum</th><th>Leistung</th><th class="n">Betrag</th></tr></thead><tbody>${p.ts.map(t=>`<tr><td>${new Date(t.d).toLocaleDateString('de-DE')}</td><td>Lerntherapie 60 min${t.s=='ausgefallen'?' (Ausfall < 24 h)':t.s=='unent'?' (nicht erschienen)':''}</td><td class="n">${eur(p.k.satz)}</td></tr>`).join('')}<tr><td></td><td><b>Gesamt</b></td><td class="n"><b>${eur(p.sum)}</b></td></tr></tbody></table>
<p style="font-size:11px;color:#5d6973">Gem. § 4 Nr. 21 UStG umsatzsteuerfrei (zu prüfen) · Zahlbar innerhalb 14 Tagen</p></div><p class="sub" style="margin-top:8px">PDF-Vorschau</p></div></div>`}};
const NAV=[['uebersicht','Übersicht'],['kalender','Kalender'],['klienten','Klienten'],['doku','Dokumentieren'],['rechnungen','Rechnungen']];
const nav=document.getElementById('nav'),main=document.getElementById('main'),pop=document.getElementById('pop'),dlg=document.getElementById('dlg');
function render(){let v=location.hash.slice(1)||'uebersicht';if(!V[v]||v=='akte'&&!V._k)v='uebersicht';
nav.innerHTML=nav.firstElementChild.outerHTML+NAV.map(([i,l])=>`<a href="#${i}" class="${v==i||(v=='akte'&&i=='klienten')?'on':''}">${l}${i=='uebersicht'&&offen().length?`<span class="badge">${offen().length}</span>`:''}</a>`).join('');
main.innerHTML=V[v]()+'<p class="note">Entwurf mit erfundenen Beispieldaten.</p>'}
function status(id){const t=T.find(x=>x.id==id),k=kl(t.k),h=(new Date(t.d)-NOW)/36e5,vor=h>0;
dlg.innerHTML=`<h2>${esc(k.name)}</h2><div class="sub" style="margin:0">${fd(t.d)}, ${ft(t.d)} · aktuell ${st(t.s)}</div>
<p class="hint">${h>=24?'Mehr als 24 h vorher: kostenfreie Absage möglich.':vor?`Noch ${Math.round(h)} h bis zum Termin – Absage gilt als <b>ausgefallen</b> und wird berechnet.`:'Termin liegt in der Vergangenheit.'}</p>
<div class="opts">${[['statt','Hat wie geplant stattgefunden',vor],['abgesagt','Rechtzeitig abgesagt, nicht berechnet',h<24],['ausgefallen','Kurzfristig gemeldet, wird berechnet',false],['unent','Ohne Nachricht nicht erschienen, wird berechnet',vor]].map(([s,d,dis])=>`<button data-set="${s}" data-id="${id}" ${dis?'disabled':''} style="--c:var(${ST[s][1]})"><span class="st"></span><span><b>${ST[s][0]}</b><small>${d}</small></span></button>`).join('')}</div>
<div class="row"><button data-doku="${k.id}">Aufzeichnung schreiben</button><span class="sp"></span><button data-close>Schließen</button></div>`;pop.classList.add('on')}
function edit(id){const k=kl(id)||{name:'',geb:'',schwer:'',kontakt:'',satz:58,kostentraeger:'Selbstzahler'};
dlg.innerHTML=`<h2>${id?'Klient bearbeiten':'Neuer Klient'}</h2><label>Name</label><input value="${esc(k.name)}"><label>Jahrgang</label><input value="${esc(k.geb)}"><label>Schwerpunkt</label><input value="${esc(k.schwer)}"><label>Kontakt</label><input value="${esc(k.kontakt)}"><label>Kostenträger</label><select><option>Selbstzahler</option><option ${k.kostentraeger.startsWith('Jugend')?'selected':''}>Jugendamt (§ 35a SGB VIII)</option></select><label>Stundensatz (€)</label><input type="number" value="${k.satz}">${id?'':'<label>Ersttermin</label><input type="datetime-local"><p class="hint">Mit Ersttermin wird automatisch eine Material-Erinnerung 7 Tage vorher angelegt.</p>'}
<div class="row" style="margin-top:14px"><span class="sp"></span><button data-close>Abbrechen</button><button class="pri" data-close>Speichern</button></div>`;pop.classList.add('on')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-term],[data-set],[data-close],[data-send],[data-go],[data-kl],[data-tab],[data-edit],[data-archive],[data-doku],[data-arch],[data-neu]');if(!b)return;const d=b.dataset;
if(d.term)return status(d.term);
if(d.set){T.find(t=>t.id==d.id).s=d.set;pop.classList.remove('on');return render()}
if('close' in d){pop.classList.remove('on');return}
if(d.send){Object.assign(kl(d.send).material,{versandt:true,am:'2026-11-26',wie:'E-Mail'});return render()}
if(d.go){location.hash=d.go;return}
if(d.kl){V._k=+d.kl;V._tab='hist';location.hash='akte';return render()}
if(d.tab){V._tab=d.tab;return render()}
if(d.edit!==undefined)return edit(+d.edit);
if(d.archive){const k=kl(d.archive);k.aktiv=!k.aktiv;return render()}
if(d.doku){V._k=+d.doku;pop.classList.remove('on');location.hash='doku';return render()}
if('arch' in d){V._arch=!V._arch;return render()}
if('neu' in d)return edit(0)});
document.addEventListener('submit',e=>{e.preventDefault();const k=+document.getElementById('dk').value,d=document.getElementById('dd').value,txt=[document.getElementById('dt').value,document.getElementById('db').value].filter(Boolean).join(' – ');
const t=T.find(t=>t.k==k&&t.d==d);if(t){t.s='statt';t.txt=txt}else T.push({id:T.length+1,k,d,s:'statt',txt,dauer:60});V._k=k;V._tab='hist';location.hash='akte';render()});
addEventListener('hashchange',render);render();
}</script></body></html>
